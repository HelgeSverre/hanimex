[package]
name = "recovered-chips"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pin-level reference models for the recovered AY-3-8606 and AY-3-8500 circuits"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
pong = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
